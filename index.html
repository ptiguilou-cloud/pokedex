<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokédex de la chaîne</title>
<meta name="description" content="Retrouve tous les Pokémon capturés pendant le stream.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23fff' stroke='%23222' stroke-width='8'/><path d='M4 50a46 46 0 0 1 92 0z' fill='%23e3350d' stroke='%23222' stroke-width='8'/><circle cx='50' cy='50' r='13' fill='%23fff' stroke='%23222' stroke-width='8'/></svg>">
<!--
  Page publiée sur GitHub Pages par capture_pokemon.py, avec le fichier donnees.json.
  Lien direct vers un Dex : .../#pseudo
-->
<style>
  /* Identité visuelle : sombre façon Twitch, comme les overlays du stream */
  :root {
    --page: #0e0e10; --fond: #18181b; --fond2: #1f1f23; --fond3: #26262c; --bord: #2f2f35;
    --texte: #efeff1; --gris: #adadb8;
    --violet: #9146ff; --violet-fonce: #772ce8; --violet-clair: #bf94ff;
    --bleu: #387aff; --rosec: #f5009b; --vert: #00f593; --jaune: #ffcb05;
    --rayon: 10px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--page); color: var(--texte);
    font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif; }
  a { color: inherit; }
  button, input, select { font: inherit; color: inherit; }
  .conteneur { max-width: 1080px; margin: 0 auto; padding: 0 16px 48px; }
  .cache { display: none !important; }

  /* ---------- En-tête ---------- */
  header { position: sticky; top: 0; z-index: 5; background: var(--fond); border-bottom: 1px solid var(--bord);
    box-shadow: 0 1px 6px rgba(0, 0, 0, .4); }
  .entete { max-width: 1080px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .marque { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; }
  .pokeball { width: 30px; height: 30px; flex: none; border-radius: 50%; border: 3px solid #0e0e10; position: relative;
    background: linear-gradient(var(--violet) 0 46%, #0e0e10 46% 54%, #fff 54%); box-shadow: 0 0 0 1px var(--bord); }
  .pokeball::after { content: ''; position: absolute; inset: 0; margin: auto; width: 9px; height: 9px; border-radius: 50%;
    background: #fff; border: 3px solid #0e0e10; }
  .marque h1 { margin: 0; font-size: 18px; line-height: 1.15; font-weight: 800; }
  .marque h1 span { color: var(--violet-clair); }
  .marque small { display: block; color: var(--gris); font-size: 12px; font-weight: 400; }
  form.recherche { display: flex; gap: 8px; flex: 1 1 280px; max-width: 420px; }
  .recherche input { flex: 1; min-width: 0; padding: 8px 12px; border-radius: 6px; border: 2px solid transparent;
    background: var(--fond3); outline: none; transition: border-color .15s, background .15s; }
  .recherche input:hover { border-color: var(--bord); }
  .recherche input:focus { border-color: var(--violet); background: var(--page); }
  .bouton { padding: 8px 14px; border-radius: 6px; border: 0; background: var(--violet); color: #fff; font-weight: 700;
    cursor: pointer; white-space: nowrap; transition: background .15s; }
  .bouton:hover { background: var(--violet-fonce); }
  .bouton.secondaire { background: var(--fond3); color: var(--texte); }
  .bouton.secondaire:hover { background: var(--bord); }
  .bouton:focus-visible, .puce-filtre:focus-visible, .dresseur:focus-visible, .ligne:focus-visible, .mini:focus-visible {
    outline: 2px solid var(--violet-clair); outline-offset: 2px; }

  /* ---------- Cartes à en-tête (comme les overlays) ---------- */
  section { margin-top: 24px; }
  .carte { background: var(--fond); border: 1px solid var(--bord); border-radius: var(--rayon); overflow: hidden; }
  .tete { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--fond2);
    border-bottom: 1px solid var(--bord); font-size: 14px; color: var(--gris); }
  .tete b { color: var(--texte); }
  .tete-droite { margin-left: auto; }
  .pastille { background: var(--violet); color: #fff; font-weight: 800; font-size: 12px; letter-spacing: .6px;
    padding: 2px 8px; border-radius: 4px; text-transform: uppercase; white-space: nowrap; }
  .corps { padding: 12px 14px; }
  .vide { color: var(--gris); padding: 6px 0; }
  .etat { text-align: center; color: var(--gris); padding: 60px 0; }

  /* Champion */
  .champion { display: flex; align-items: center; gap: 14px; padding: 14px 16px; text-decoration: none;
    background: linear-gradient(90deg, rgba(145, 70, 255, .25), rgba(145, 70, 255, 0) 70%), var(--fond);
    border: 1px solid var(--violet); border-radius: var(--rayon); }
  .champion .couronne { font-size: 34px; }
  .champion b { font-size: 20px; }
  .champion p { margin: 2px 0 0; color: var(--gris); font-size: 14px; }

  /* Classement */
  .classement { display: grid; gap: 6px; }
  .ligne { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px;
    border-radius: 6px; background: var(--fond2); border: 1px solid var(--bord); text-decoration: none; transition: background .15s; }
  .ligne:hover { background: var(--fond3); }
  .ligne:first-child { border-color: var(--violet); }
  .ligne .pos { font-weight: 900; font-size: 17px; text-align: center; color: var(--gris); }
  .ligne:first-child .pos { color: var(--violet-clair); }
  .ligne small { display: block; color: var(--gris); font-size: 12px; }
  .ligne .score { text-align: right; font-weight: 700; }

  /* Dernières captures */
  .defile { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x mandatory; }
  .mini { flex: none; width: 108px; text-align: center; background: var(--fond2); border: 1px solid var(--bord);
    border-radius: 6px; padding: 6px 6px 8px; scroll-snap-align: start; text-decoration: none; transition: background .15s; }
  .mini:hover { background: var(--fond3); }
  .mini img { width: 72px; height: 72px; image-rendering: pixelated; }
  .mini b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini small { color: var(--gris); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Liste des dresseurs */
  .dresseurs { display: flex; flex-wrap: wrap; gap: 6px; }
  .dresseur { padding: 5px 11px; border-radius: 4px; background: var(--fond3); text-decoration: none; font-size: 14px;
    transition: background .15s; }
  .dresseur:hover { background: var(--violet); }
  .dresseur span { color: var(--gris); margin-left: 4px; }
  .dresseur:hover span { color: #fff; }

  /* ---------- Vue Dex ---------- */
  .retour { display: inline-block; margin-top: 18px; color: var(--violet-clair); text-decoration: none; font-size: 14px; font-weight: 600; }
  .retour:hover { text-decoration: underline; }
  .titre-dex { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; margin-top: 12px; }
  .titre-dex h2 { font-size: clamp(26px, 5vw, 38px); margin: 0; font-weight: 800; word-break: break-word; }
  .titre-dex h2 span { color: var(--violet-clair); }
  .stats { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .stats > div { background: var(--fond3); padding: 5px 10px; border-radius: 4px; font-size: 14px; }
  .stats > .or { background: var(--violet); color: #fff; font-weight: 700; }
  .progression .barre { height: 6px; background: var(--fond3); border-radius: 3px; overflow: hidden; }
  .progression .barre div { height: 100%; background: linear-gradient(90deg, var(--violet), var(--rosec)); border-radius: 3px; }
  .progression small { color: var(--gris); font-size: 13px; }
  .outils { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 16px 0 10px; }
  .puce-filtre { padding: 6px 12px; border-radius: 4px; border: 0; background: var(--fond3); cursor: pointer; font-size: 14px;
    font-weight: 600; transition: background .15s; }
  .puce-filtre:hover { background: var(--bord); }
  .puce-filtre[aria-pressed="true"] { background: var(--violet); color: #fff; }
  .outils select { margin-left: auto; padding: 6px 10px; border-radius: 4px; border: 2px solid transparent; background: var(--fond3); }
  .outils select:focus { border-color: var(--violet); outline: none; }
  .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
  .carte-poke { position: relative; background: var(--fond); border: 1px solid var(--bord); border-radius: 8px;
    padding: 8px 8px 10px; text-align: center; transition: transform .15s, border-color .15s; }
  .carte-poke:hover { transform: translateY(-2px); border-color: var(--gris); }
  .carte-poke img { width: 92px; height: 92px; image-rendering: pixelated; }
  .carte-poke .num { position: absolute; top: 7px; left: 9px; font-size: 11px; color: var(--gris); font-variant-numeric: tabular-nums; }
  .carte-poke .niv { position: absolute; top: 7px; right: 9px; font-size: 11px; font-weight: 800; color: var(--gris); }
  .carte-poke b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .carte-poke .tag { display: inline-block; margin-top: 4px; font-size: 10px; font-weight: 800; letter-spacing: .5px;
    text-transform: uppercase; padding: 1px 6px; border-radius: 4px; }
  .carte-poke.shiny { border-color: var(--jaune); }
  .carte-poke.shiny img { filter: drop-shadow(0 0 8px rgba(255, 230, 109, .7)); }
  .carte-poke.obscur { border-color: #a64dff; background: linear-gradient(180deg, rgba(91, 42, 134, .4), var(--fond)); }
  .carte-poke.obscur img { filter: drop-shadow(0 0 8px rgba(166, 77, 255, .8)); }
  .carte-poke.baron { border-color: #e5383b; background: linear-gradient(180deg, rgba(193, 18, 31, .3), var(--fond)); }
  .carte-poke.baron img { filter: drop-shadow(0 0 8px rgba(229, 56, 59, .7)); }
  .tag.shiny { background: var(--jaune); color: #1a1a1a; }
  .tag.obscur { background: #5b2a86; color: #e6d0ff; }
  .tag.baron { background: #c1121f; color: #fff; }
  .genre { font-weight: 700; margin-left: 3px; }
  .genre.m { color: var(--bleu); } .genre.f { color: var(--rosec); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--violet); color: #fff;
    font-weight: 700; padding: 9px 16px; border-radius: 6px; box-shadow: 0 6px 20px rgba(0, 0, 0, .5); }

  /* ---------- Badges d'arène (gemmes dessinées, pas d'emoji) ---------- */
  .badge { display: inline-block; width: .95em; height: .95em; margin-right: .3em; vertical-align: -.12em;
    clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
    background: linear-gradient(135deg, var(--b1) 0 45%, var(--b2) 45% 100%);
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .5)); }

  footer { text-align: center; color: var(--gris); font-size: 13px; margin-top: 40px; }
  footer a { color: var(--violet-clair); }

  @media (max-width: 560px) {
    .marque h1 { font-size: 16px; }
    form.recherche { flex: 1 1 100%; max-width: none; min-width: 0; }
    .grille { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px; }
    .carte-poke img { width: 72px; height: 72px; }
    .outils select { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="entete">
    <a class="marque" href="#">
      <span class="pokeball" aria-hidden="true"></span>
      <h1>Pokédex <span id="nomChaine">du stream</span><small id="maj">Chargement…</small></h1>
    </a>
    <form class="recherche" id="recherche" role="search">
      <input id="champ" list="pseudos" placeholder="Ton pseudo Twitch…" autocomplete="off" aria-label="Pseudo du dresseur">
      <datalist id="pseudos"></datalist>
      <button class="bouton" type="submit">Voir le Dex</button>
    </form>
  </div>
</header>

<main class="conteneur">
  <div id="etat" class="etat">Chargement du Pokédex…</div>

  <!-- Accueil -->
  <div id="accueil" class="cache">
    <section id="blocChampion"></section>
    <section class="carte">
      <div class="tete"><span class="pastille">🏆 Classement</span><b>Arène Pokémon</b></div>
      <div class="corps"><div id="classement" class="classement"></div></div>
    </section>
    <section class="carte">
      <div class="tete"><span class="pastille">🎉 Captures</span><b>Les dernières prises du live</b></div>
      <div class="corps"><div id="dernieres" class="defile"></div></div>
    </section>
    <section class="carte">
      <div class="tete"><span class="pastille">📖 Dresseurs</span><b>Tous les Dex</b><span class="tete-droite" id="nbDresseurs"></span></div>
      <div class="corps"><div id="dresseurs" class="dresseurs"></div></div>
    </section>
  </div>

  <!-- Dex d'un dresseur -->
  <div id="vueDex" class="cache">
    <a class="retour" href="#">← Tous les dresseurs</a>
    <div class="titre-dex">
      <h2 id="titreDex"></h2>
      <button class="bouton" id="partager" type="button">🔗 Copier le lien de ce Dex</button>
    </div>
    <div class="stats" id="statsDex"></div>
    <div class="progression" id="progression"></div>
    <div class="outils" id="outils">
      <button class="puce-filtre" data-filtre="tous" aria-pressed="true">Tous</button>
      <button class="puce-filtre" data-filtre="shiny" aria-pressed="false">✨ Shiny</button>
      <button class="puce-filtre" data-filtre="obscur" aria-pressed="false">🌑 Obscur</button>
      <button class="puce-filtre" data-filtre="baron" aria-pressed="false">👑 Baron</button>
      <select id="tri" aria-label="Trier">
        <option value="niveau">Trier par niveau</option>
        <option value="numero">Trier par n° du Pokédex</option>
        <option value="nom">Trier par nom</option>
        <option value="rarete">Trier par rareté</option>
      </select>
    </div>
    <div id="grille" class="grille"></div>
  </div>

  <footer id="pied"></footer>
</main>
<div id="toast" class="toast cache" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const BASE = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
const sprite = (n, type) => `${BASE}${type === 'shiny' ? 'shiny/' : ''}${n}.png`;
// si l'image shiny n'existe pas, on prend l'image normale
const secours = n => `onerror="this.onerror=null;this.src='${BASE}${n}.png'"`;
const RARETE = { shiny: 0, baron: 1, obscur: 2, normal: 3 };
const MARQUE = { shiny: '✨', obscur: '🌑', baron: '👑' };
const cleNom = s => String(s).toLowerCase();

// Badges d'arène : petite gemme colorée + nom (rendu identique sur tous les appareils)
const COULEURS_BADGES = {
  'Badge Roche': ['#d6d6d6', '#8a8a8a'], 'Badge Cascade': ['#bfe2ff', '#3a8ee8'],
  'Badge Foudre': ['#ffd6a0', '#ff7a00'], 'Badge Prisme': ['#b9f5c9', '#c25bff'],
  'Badge Âme': ['#ffd3e6', '#ff4f9a'], 'Badge Marais': ['#fff3a0', '#c99a00'],
  'Badge Volcan': ['#ffc2a8', '#e3350d'], 'Badge Terre': ['#c9f5d6', '#2f9e5a'],
  'Maître Pokémon': ['#ffe066', '#9146ff'],
};
function badge(nom) {
  const [b1, b2] = COULEURS_BADGES[nom] || ['#ddd', '#888'];
  return `<span class="badge" style="--b1:${b1};--b2:${b2}"></span>${esc(nom)}`;
}

let donnees = null;
let filtre = 'tous';

function quand(iso) {
  // Heure du dernier changement (capture, combat, don...) et non de la dernière visite du script
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const heure = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const jour = new Date().toDateString() === d.toDateString() ? 'aujourd\'hui'
    : 'le ' + d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
  return `${jour} à ${heure}`;
}

function carteMini(c) {
  return `<a class="mini" href="#${encodeURIComponent(c.dresseur)}">` +
    `<img src="${sprite(c.numero, c.type)}" ${secours(c.numero)} alt="" loading="lazy">` +
    `<b>${esc(c.nom)} ${MARQUE[c.type] || ''}</b><small>${esc(c.dresseur)}</small></a>`;
}

// ---------- Accueil ----------
function afficherAccueil() {
  const d = donnees;
  $('blocChampion').innerHTML = d.champion
    ? `<a class="champion" href="#${encodeURIComponent(d.champion)}" style="text-decoration:none">
         <span class="couronne">👑</span>
         <div><b>${esc(d.champion)}</b><p>Champion de l'Arène · ${d.defenses} défense${d.defenses > 1 ? 's' : ''} réussie${d.defenses > 1 ? 's' : ''}</p></div></a>`
    : '';
  $('blocChampion').classList.toggle('cache', !d.champion);

  const top = d.dresseurs.filter(x => x.victoires + x.defaites > 0)
    .sort((a, b) => b.elo - a.elo || b.victoires - a.victoires).slice(0, 10);
  $('classement').innerHTML = top.length ? top.map((x, i) =>
    `<a class="ligne" href="#${encodeURIComponent(x.nom)}"><span class="pos">${i + 1}</span>` +
    `<span>${x.champion ? '👑 ' : ''}<b>${esc(x.nom)}</b><small>${badge(x.rang)}</small></span>` +
    `<span class="score">${x.elo} pts<small>${x.victoires}V / ${x.defaites}D</small></span></a>`).join('')
    : '<div class="vide">Aucun combat pour l\'instant. Défie quelqu\'un en live avec !combat @pseudo</div>';

  $('dernieres').innerHTML = (d.dernieres_captures || []).filter(c => c.numero).map(carteMini).join('')
    || '<div class="vide">Aucune capture pour l\'instant.</div>';

  const tous = [...d.dresseurs].sort((a, b) => b.pokemons.length - a.pokemons.length || a.nom.localeCompare(b.nom));
  $('nbDresseurs').textContent = `${tous.length} dresseurs`;
  $('dresseurs').innerHTML = tous.map(x =>
    `<a class="dresseur" href="#${encodeURIComponent(x.nom)}">${x.champion ? '👑 ' : ''}${esc(x.nom)}<span>${x.pokemons.length}</span></a>`).join('');

  $('accueil').classList.remove('cache');
  $('vueDex').classList.add('cache');
  document.title = `Pokédex de ${d.chaine || 'la chaîne'}`;
}

// ---------- Dex d'un dresseur ----------
function afficherDex(nom) {
  const x = donnees.dresseurs.find(d => cleNom(d.nom) === cleNom(nom));
  if (!x) {
    $('accueil').classList.add('cache');
    $('vueDex').classList.remove('cache');
    $('titreDex').innerHTML = `${esc(nom)}<span>Dex</span>`;
    $('statsDex').innerHTML = '';
    $('progression').innerHTML = '';
    $('outils').classList.add('cache');
    $('partager').classList.add('cache');
    $('grille').innerHTML = `<div class="vide" style="grid-column:1/-1">Aucun dresseur à ce nom pour l'instant. ` +
      `Capture ton premier Pokémon en live (Pokéball avec les points de chaîne, ou un Pokémon sauvage) !</div>`;
    return;
  }
  const especes = new Set(x.pokemons.map(p => p.numero)).size;
  const variantes = x.pokemons.filter(p => p.type !== 'normal').length;
  $('titreDex').innerHTML = `${esc(x.nom)}<span>Dex</span>`;
  $('statsDex').innerHTML =
    `<div>💰 ${x.pieces} poképièces</div><div>${badge(x.rang)}</div>` +
    `<div>⚔️ ${x.victoires}V / ${x.defaites}D</div>` +
    (x.meilleure_serie > 1 ? `<div>🔥 Meilleure série : ${x.meilleure_serie}</div>` : '') +
    (variantes ? `<div>✨ ${variantes} variante${variantes > 1 ? 's' : ''}</div>` : '') +
    (x.champion ? '<div class="or">👑 Champion de l\'Arène</div>' : '');
  const pct = Math.min(100, 100 * especes / (donnees.pokedex_max || 1025));
  $('progression').innerHTML = `<div class="barre"><div style="width:${pct}%"></div></div>` +
    `<small>${x.pokemons.length} Pokémon · ${especes} espèce${especes > 1 ? 's' : ''} sur ${donnees.pokedex_max || 1025}</small>`;
  $('outils').classList.toggle('cache', !x.pokemons.length);
  $('partager').classList.remove('cache');
  $('partager').onclick = () => copier(location.href, 'Lien copié !');
  dessinerGrille(x);
  $('accueil').classList.add('cache');
  $('vueDex').classList.remove('cache');
  document.title = `${x.nom}Dex · Pokédex de ${donnees.chaine || 'la chaîne'}`;
}

function dessinerGrille(x) {
  const tri = $('tri').value;
  const liste = x.pokemons.filter(p => filtre === 'tous' || p.type === filtre).sort((a, b) =>
    tri === 'numero' ? a.numero - b.numero :
    tri === 'nom' ? a.nom.localeCompare(b.nom) :
    tri === 'rarete' ? (RARETE[a.type] ?? 3) - (RARETE[b.type] ?? 3) || b.niveau - a.niveau :
    b.niveau - a.niveau || (RARETE[a.type] ?? 3) - (RARETE[b.type] ?? 3) || a.numero - b.numero);
  $('grille').innerHTML = liste.length ? liste.map(p => {
    const g = p.genre === '♂' ? '<span class="genre m">♂</span>' : p.genre === '♀' ? '<span class="genre f">♀</span>' : '';
    return `<div class="carte-poke ${p.type}"><span class="num">#${String(p.numero).padStart(3, '0')}</span>` +
      `<span class="niv">N.${p.niveau}</span>` +
      `<img src="${sprite(p.numero, p.type)}" ${secours(p.numero)} alt="" loading="lazy">` +
      `<b>${esc(p.nom)}${g}</b>` + (p.type !== 'normal' ? `<span class="tag ${p.type}">${p.type}</span>` : '') + '</div>';
  }).join('') : `<div class="vide" style="grid-column:1/-1">${x.pokemons.length ? 'Aucun Pokémon de ce type.' : 'Aucun Pokémon pour l\'instant.'}</div>`;
}

document.querySelectorAll('.puce-filtre').forEach(b => b.onclick = () => {
  filtre = b.dataset.filtre;
  document.querySelectorAll('.puce-filtre').forEach(o => o.setAttribute('aria-pressed', o === b));
  router();
});
$('tri').onchange = () => router();

function copier(texte, message) {
  const fini = () => { const t = $('toast'); t.textContent = message; t.classList.remove('cache'); setTimeout(() => t.classList.add('cache'), 1800); };
  if (navigator.clipboard) navigator.clipboard.writeText(texte).then(fini, () => prompt('Copie ce lien :', texte));
  else prompt('Copie ce lien :', texte);
}

// ---------- Navigation : #pseudo ----------
function router() {
  if (!donnees) return;
  const nom = decodeURIComponent(location.hash.slice(1)).trim().replace(/^@/, '');
  if (nom) afficherDex(nom); else afficherAccueil();
}
window.addEventListener('hashchange', () => { filtre = 'tous'; document.querySelectorAll('.puce-filtre').forEach(o => o.setAttribute('aria-pressed', o.dataset.filtre === 'tous')); router(); window.scrollTo(0, 0); });
$('recherche').onsubmit = e => {
  e.preventDefault();
  const v = $('champ').value.trim().replace(/^@/, '');
  if (v) location.hash = encodeURIComponent(v);
  $('champ').blur();
};

// ---------- Chargement ----------
async function charger() {
  try {
    const rep = await fetch('donnees.json?t=' + Date.now(), { cache: 'no-store' });
    if (!rep.ok) throw new Error(rep.status);
    donnees = await rep.json();
  } catch (e) {
    if (!donnees) $('etat').textContent = 'Le Pokédex n\'est pas encore disponible. Reviens dans quelques minutes !';
    return;
  }
  $('etat').classList.add('cache');
  $('nomChaine').textContent = donnees.chaine ? 'de ' + donnees.chaine : 'du stream';
  $('maj').textContent = 'Dernière nouveauté : ' + quand(donnees.maj);
  $('pseudos').innerHTML = donnees.dresseurs.map(x => `<option value="${esc(x.nom)}">`).join('');
  $('pied').innerHTML = donnees.chaine
    ? `Les captures se font en live sur <a href="https://twitch.tv/${encodeURIComponent(donnees.chaine)}" target="_blank" rel="noopener">twitch.tv/${esc(donnees.chaine)}</a>`
    : '';
  router();
}
charger();
setInterval(charger, 5 * 60 * 1000);   // rafraîchit toutes les 5 min si la page reste ouverte
</script>
</body>
</html>
